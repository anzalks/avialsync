[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avialsync"
version = "0.1.0b8"
description = "GUI desktop app to scrub time-synchronized multi-camera video and dense time series."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Anzal K Shahul", email = "anzal.ks@gmail.com" }]
keywords = [
    "neuroscience",
    "electrophysiology",
    "behaviour",
    "video",
    "synchronization",
    "time-series",
    "pose-estimation",
    "multi-camera",
]
# Not decoration: the `Programming Language :: Python` entries are what the
# supported-versions badge and PyPI's own filters read, and without any of these
# the project appears in no category on PyPI at all.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PySide6",
    "pyqtgraph",
    "python-mpv>=1.0.7",
    "numpy",
    "polars",
    "xxhash",
    "neo",
    # Not imported by us: a floor on neo's own dependency. Up to and including
    # 0.16.2, `quantities` decorates a method with `@with_doc(np.ndarray.ptp)`,
    # and NumPy 2 removed that method, so merely importing neo raises
    # AttributeError. 0.16.3 switched to the `np.ptp` function. `quantities`
    # itself declares only `numpy>=1.24`, so nothing else stops pip pairing a
    # broken version with NumPy 2 — that pairing is a real user report.
    "quantities>=0.16.3",
    # Windows ships no IANA time zone database, so `zoneinfo` finds nothing and
    # every timezone-aware CSV import fails there with "The selected timezone is
    # unavailable on this system." Every other platform reads the system copy.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/anzalks/avialsync"
Documentation = "https://avialsync.readthedocs.io/"
Source = "https://github.com/anzalks/avialsync"
Issues = "https://github.com/anzalks/avialsync/issues"
Changelog = "https://github.com/anzalks/avialsync/releases"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",  # MIT; TESTING §1 coverage targets
    "hypothesis",
    "build",  # MIT; release helper builds the wheel and sdist before tagging.
    "twine",  # Apache-2.0; release helper validates distribution metadata.
    "Pillow",  # HPND; reproducibly generates PNG, ICO, and ICNS icon assets.
    "PyYAML",  # MIT; workflow contract tests parse .github/workflows directly.
    "ruff",
    "mypy"
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1",  # MIT; the documentation theme, also used by Read the Docs
]

[project.scripts]
avialsync = "avialsync.__main__:main"

[project.entry-points."avialsync.loaders"]
csv = "avialsync.loaders.csv_loader:CSVLoader"
video = "avialsync.loaders.video_standard:VideoStandardLoader"
tracking = "avialsync.loaders.tracking_loader:TrackingLoader"
neo = "avialsync.loaders.neo_loader:NeoLoader"
aol_encoder = "avialsync.loaders.aol_encoder_loader:AOLEncoderLoader"
aol_eks = "avialsync.loaders.aol_eks_loader:AOLEksLoader"
open_ephys_camera = "avialsync.loaders.open_ephys_camera:OpenEphysCameraLoader"

# Session scanners lay out a whole recording folder (D-068). A lab adds support
# for its own directory layout by publishing here; nothing in the application
# names a format.
[project.entry-points."avialsync.sessions"]
aol = "avialsync.loaders.aol_session_loader:AOLSessionSource"
open_ephys = "avialsync.loaders.open_ephys_session:OpenEphysSessionSource"

[tool.hatch.build.targets.wheel]
packages = ["src/avialsync"]
include = ["src/avialsync/resources/avialsync.png"]

[tool.coverage.run]
source = ["avialsync"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]







# These third-party packages ship no type stubs and no py.typed marker. This is
# the one legitimate suppression (AGENTS §Coding standards): it silences the
# *absence of stubs*, not errors in our own code.
[[tool.mypy.overrides]]
module = ["mpv.*", "pyqtgraph.*", "neo.*", "quantities.*", "pyarrow.*", "polars.*", "xxhash.*"]
ignore_missing_imports = true
