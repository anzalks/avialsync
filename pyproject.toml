[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinochronix"
version = "0.0.1"
description = "GUI desktop app to scrub time-synchronized multi-camera video and dense time series."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6",
    "pyqtgraph",
    "python-mpv>=1.0.7",
    "numpy",
    "polars",
    "xxhash",
    "neo"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-benchmark",
    "hypothesis",
    "ruff",
    "mypy"
]
docs = []

[project.scripts]
kinochronix = "kinochronix.__main__:main"

[project.entry-points."kinochronix.loaders"]
csv = "kinochronix.loaders.csv_loader:CSVLoader"
video = "kinochronix.loaders.video_standard:VideoStandardLoader"
tracking = "kinochronix.loaders.tracking_loader:TrackingLoader"
neo = "kinochronix.loaders.neo_loader:NeoLoader"

[tool.hatch.build.targets.wheel]
packages = ["src/kinochronix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[[tool.mypy.overrides]]
module = "kinochronix.ui.transport"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.sidebar"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.relink_dialog"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.diagnostics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.plot_pane"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.video_pane"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.readout_panel"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.ui.video_grid"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.engine.export"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.loaders.neo_loader"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kinochronix.loaders.csv_loader"
ignore_errors = true
