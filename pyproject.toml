[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avialsync"
version = "0.1.0b5"
description = "GUI desktop app to scrub time-synchronized multi-camera video and dense time series."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6",
    "pyqtgraph",
    "python-mpv>=1.0.7",
    "numpy",
    "polars",
    "xxhash",
    "neo",
    # Windows ships no IANA time zone database, so `zoneinfo` finds nothing and
    # every timezone-aware CSV import fails there with "The selected timezone is
    # unavailable on this system." Every other platform reads the system copy.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",  # MIT; TESTING §1 coverage targets
    "hypothesis",
    "build",  # MIT; release helper builds the wheel and sdist before tagging.
    "twine",  # Apache-2.0; release helper validates distribution metadata.
    "Pillow",  # HPND; reproducibly generates PNG, ICO, and ICNS icon assets.
    "PyYAML",  # MIT; workflow contract tests parse .github/workflows directly.
    "ruff",
    "mypy"
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
]

[project.scripts]
avialsync = "avialsync.__main__:main"

[project.entry-points."avialsync.loaders"]
csv = "avialsync.loaders.csv_loader:CSVLoader"
video = "avialsync.loaders.video_standard:VideoStandardLoader"
tracking = "avialsync.loaders.tracking_loader:TrackingLoader"
neo = "avialsync.loaders.neo_loader:NeoLoader"
aol_encoder = "avialsync.loaders.aol_encoder_loader:AOLEncoderLoader"
aol_eks = "avialsync.loaders.aol_eks_loader:AOLEksLoader"

# Session scanners lay out a whole recording folder (D-068). A lab adds support
# for its own directory layout by publishing here; nothing in the application
# names a format.
[project.entry-points."avialsync.sessions"]
aol = "avialsync.loaders.aol_session_loader:AOLSessionSource"

[tool.hatch.build.targets.wheel]
packages = ["src/avialsync"]
include = ["src/avialsync/resources/avialsync.png"]

[tool.coverage.run]
source = ["avialsync"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]







# These third-party packages ship no type stubs and no py.typed marker. This is
# the one legitimate suppression (AGENTS §Coding standards): it silences the
# *absence of stubs*, not errors in our own code.
[[tool.mypy.overrides]]
module = ["mpv.*", "pyqtgraph.*", "neo.*", "quantities.*", "pyarrow.*", "polars.*", "xxhash.*"]
ignore_missing_imports = true
