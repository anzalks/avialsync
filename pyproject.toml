[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avialview"
version = "0.1.0b4"
description = "GUI desktop app to scrub time-synchronized multi-camera video and dense time series."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6",
    "pyqtgraph",
    "python-mpv>=1.0.7",
    "numpy",
    "polars",
    "xxhash",
    "neo"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",  # MIT; TESTING §1 coverage targets
    "hypothesis",
    "build",  # MIT; release helper builds the wheel and sdist before tagging.
    "twine",  # Apache-2.0; release helper validates distribution metadata.
    "Pillow",  # HPND; reproducibly generates PNG, ICO, and ICNS icon assets.
    "ruff",
    "mypy"
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
]

[project.scripts]
avialview = "avialview.__main__:main"

[project.entry-points."avialview.loaders"]
csv = "avialview.loaders.csv_loader:CSVLoader"
video = "avialview.loaders.video_standard:VideoStandardLoader"
tracking = "avialview.loaders.tracking_loader:TrackingLoader"
neo = "avialview.loaders.neo_loader:NeoLoader"
aol_encoder = "avialview.loaders.aol_encoder_loader:AOLEncoderLoader"
aol_eks = "avialview.loaders.aol_eks_loader:AOLEksLoader"

[tool.hatch.build.targets.wheel]
packages = ["src/avialview"]
include = ["src/avialview/resources/avialview.png"]

[tool.coverage.run]
source = ["avialview"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]







[[tool.mypy.overrides]]
module = "avialview.ui.plot_row"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "avialview.ui.plot_sweep"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "avialview.ui.plot_interactions"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "avialview.ui.plot_overlays"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# These third-party packages ship no type stubs and no py.typed marker. This is
# the one legitimate suppression (AGENTS §Coding standards): it silences the
# *absence of stubs*, not errors in our own code.
[[tool.mypy.overrides]]
module = ["mpv.*", "pyqtgraph.*", "neo.*", "quantities.*", "pyarrow.*", "polars.*", "xxhash.*"]
ignore_missing_imports = true
