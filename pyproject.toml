[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avialview"
version = "0.1.0b4"
description = "GUI desktop app to scrub time-synchronized multi-camera video and dense time series."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6",
    "pyqtgraph",
    "python-mpv>=1.0.7",
    "numpy",
    "polars",
    "xxhash",
    "neo"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-benchmark",
    "pytest-timeout>=2.3",
    "hypothesis",
    "build",  # MIT; release helper builds the wheel and sdist before tagging.
    "twine",  # Apache-2.0; release helper validates distribution metadata.
    "ruff",
    "mypy"
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
]

[project.scripts]
avialview = "avialview.__main__:main"

[project.entry-points."avialview.loaders"]
csv = "avialview.loaders.csv_loader:CSVLoader"
video = "avialview.loaders.video_standard:VideoStandardLoader"
tracking = "avialview.loaders.tracking_loader:TrackingLoader"
neo = "avialview.loaders.neo_loader:NeoLoader"

[tool.hatch.build.targets.wheel]
packages = ["src/avialview"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[[tool.mypy.overrides]]
module = "avialview.ui.transport"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.sidebar"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.relink_dialog"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.diagnostics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.plot_pane"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.video_pane"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.readout_panel"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.ui.video_grid"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.engine.export"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.loaders.neo_loader"
ignore_errors = true

[[tool.mypy.overrides]]
module = "avialview.loaders.csv_loader"
ignore_errors = true
