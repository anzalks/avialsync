[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinochronix-plugin-example"
version = "0.1.0"
description = "Example KinoChronix v1 time-series plugin"
requires-python = ">=3.11"
dependencies = ["kinochronix", "numpy"]

[project.entry-points."kinochronix.loaders"]
toy_binary = "kinochronix_plugin_example:ToyBinarySource"

[tool.hatch.build.targets.wheel]
packages = ["src/kinochronix_plugin_example"]
