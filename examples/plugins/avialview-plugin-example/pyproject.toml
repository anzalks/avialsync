[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avialview-plugin-example"
version = "0.1.0"
description = "Example AvialView v1 time-series plugin"
requires-python = ">=3.11"
dependencies = ["avialview", "numpy"]

[project.entry-points."avialview.loaders"]
toy_binary = "avialview_plugin_example:ToyBinarySource"

[tool.hatch.build.targets.wheel]
packages = ["src/avialview_plugin_example"]
