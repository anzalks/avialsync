version: 2

build:
  # Match the release documentation job.  Keeping this pinned prevents a
  # Read the Docs image update from being the first place a release discovers
  # that its documentation no longer builds.
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install --upgrade pip --constraint requirements/ci-py3.12.txt
      - python -m pip install --constraint requirements/ci-py3.12.txt --build-constraint requirements/ci-py3.12.txt ".[docs]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
