name: Release

on:
  push:
    # A version tag, not merely a "v" one: "v*" also matched vtest and v-wip,
    # which started all eight jobs before anything rejected them. Kept as
    # "v[0-9]*" rather than a full version shape on purpose — tools/
    # prepare_release.py accepts any PEP 440 public version, including "1" and
    # "0.2", and a pattern narrower than that would let a legitimate tag push
    # succeed while silently triggering no release at all.
    tags: ["v[0-9]*"]
  # Re-run a release that failed after the tag was already published, without
  # deleting and re-pushing the tag. Select the tag as the dispatch ref.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_release_ref:
    name: Verify tag is reachable from main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.declared_version.outputs.version }}
      prerelease: ${{ steps.declared_version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a tag, not a branch
        # Only reachable through workflow_dispatch, which can be launched from
        # any ref. Dispatching from a branch was already refused — but by the
        # version check, reporting "release ref main disagrees with
        # pyproject.toml", which describes the symptom rather than the mistake.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "Releases publish a version tag. $GITHUB_REF is not one:" \
                   "re-run this workflow with a tag selected as the ref." >&2
              exit 1
              ;;
          esac
      - name: Require the tagged commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $GITHUB_REF_NAME does not point to a commit reachable from main." >&2
            exit 1
          }
      - name: Require the tag to match the declared package version
        id: declared_version
        run: |
          python3 - "$GITHUB_REF_NAME" <<'VERSION_GATE'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = project["project"]["version"]
          module_source = pathlib.Path("src/avialsync/__init__.py").read_text(encoding="utf-8")
          module = re.search(r'^__version__ = "([^"]+)"', module_source, re.MULTILINE)
          if module is None:
              sys.exit("src/avialsync/__init__.py declares no __version__.")
          if tag != f"v{declared}" or module.group(1) != declared:
              sys.exit(
                  f"Release ref {tag} disagrees with pyproject.toml ({declared}) or "
                  f"src/avialsync/__init__.py ({module.group(1)}). PyPI and the GitHub "
                  "release must publish one agreed version; use tools/prepare_release.py."
              )
          # PEP 440 pre-release segments must not be advertised as a stable release.
          prerelease = bool(re.search(r"(a|b|rc)\d+$|\.dev\d+$", declared))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={declared}\n")
              output.write(f"prerelease={str(prerelease).lower()}\n")
          print(f"{tag} publishes version {declared} (prerelease={prerelease}).")
          VERSION_GATE

  quality:
    name: Release quality · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: verify_release_ref
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Recommends are excluded deliberately — see the note in ci.yml: ffmpeg's
      # recommends are a speech model and a downloader, and fetching them once
      # cost more than the entire job budget.
      - name: Install media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg libmpv2 libegl1
      - name: Install media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
      - name: Install media dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress ffmpeg
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev-x86_64-20260607-git-71ebd08.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'libmpv'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --output $archive 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z/download'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'FAA0BE46643CD889A1D816696F60B9962D7BB70E9D9D6E619DA368D0B22211D6') {
            throw 'Downloaded libmpv archive did not match its pinned SHA-256'
          }
          & "$env:ChocolateyInstall\tools\7z.exe" x $archive "-o$destination" -y | Out-Null
          $libmpv = Get-ChildItem $destination -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $libmpv) {
            throw 'Pinned libmpv archive did not contain libmpv-2.dll'
          }
          $libmpv.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pip install -e ".[dev]"
      - name: Verify libmpv is importable (Windows)
        if: runner.os == 'Windows'
        run: python -c "import mpv; print('libmpv import succeeded')"
      - name: Lint and type check
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          ruff check .
          ruff format --check .
          mypy src/avialsync/core
          mypy src/avialsync
      - name: Make fixtures
        run: python tools/make_fixtures.py --small
      - name: Verify fixture determinism
        run: |
          cp -r tests/fixtures tests/fixtures_first_run
          python tools/make_fixtures.py --small
          python -c '
          import pathlib, filecmp, sys
          p1 = pathlib.Path("tests/fixtures")
          p2 = pathlib.Path("tests/fixtures_first_run")
          for f1 in p1.rglob("*.json"):
              f2 = p2 / f1.relative_to(p1)
              if not f2.exists() or not filecmp.cmp(f1, f2, shallow=False):
                  print(f"Mismatch in {f1}")
                  sys.exit(1)
          print("Determinism check passed!")
          '
      - name: Run tests
        # Keep the release matrix diagnostically identical to PR CI.
        run: pytest --maxfail=5 -q --durations=20 --timeout=60 --timeout-method=thread --ignore=tests/benchmarks

  docs:
    name: Release documentation
    runs-on: ubuntu-24.04
    needs: verify_release_ref
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  distributions:
    name: Build Python distributions
    needs: [verify_release_ref, quality, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - run: python -m pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  smoke_test:
    name: Smoke test release wheel
    needs: distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --upgrade pip
          smoke-venv/bin/python -m pip install dist/*.whl
      - name: Verify package import
        run: smoke-venv/bin/python -c "import avialsync; print('avialsync import succeeded')"

  packages:
    name: Bundle ${{ matrix.os }}
    needs: smoke_test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: AvialSync-windows-bundle
          - os: macos-15
            artifact: AvialSync-macos-bundle
          - os: ubuntu-24.04
            artifact: AvialSync-linux-bundle
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e . "pyinstaller==6.21.0"
      - name: Install media dependencies (Linux)
        if: runner.os == 'Linux'
        # AppImageTool release 12 loads libfuse.so.2. Ubuntu 24.04 provides
        # that ABI as libfuse2t64; do not install the obsolete fuse package.
        # libegl1 is what the quality matrix treats as Qt's Linux floor, and the
        # bundle now starts Qt in this job too.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 desktop-file-utils ffmpeg libmpv2 libfuse2t64 libegl1
      - name: Install media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
      - name: Install media dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress ffmpeg
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev-x86_64-20260607-git-71ebd08.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'libmpv'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --output $archive 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z/download'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'FAA0BE46643CD889A1D816696F60B9962D7BB70E9D9D6E619DA368D0B22211D6') {
            throw 'Downloaded libmpv archive did not match its pinned SHA-256'
          }
          & "$env:ChocolateyInstall\tools\7z.exe" x $archive "-o$destination" -y | Out-Null
          $libmpv = Get-ChildItem $destination -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $libmpv) {
            throw 'Pinned libmpv archive did not contain libmpv-2.dll'
          }
          $libmpv.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify libmpv is importable (Windows)
        if: runner.os == 'Windows'
        run: python -c "import mpv; print('libmpv import succeeded')"
      - name: Stage media libraries (Linux)
        if: runner.os == 'Linux'
        run: python packaging/fetch_media_libs.py --source /usr/lib --source /usr/bin --destination packaging/media
      - name: Stage media libraries (macOS)
        if: runner.os == 'macOS'
        run: python packaging/fetch_media_libs.py --source "$(brew --prefix mpv)" --source "$(brew --prefix ffmpeg)" --destination packaging/media
      - name: Stage media libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Both package layouts: `ffmpeg` has shipped the binaries directly and
        # has also been a meta-package pointing at `ffmpeg-full`. A source that
        # does not exist is skipped, so naming both survives either.
        run: python packaging/fetch_media_libs.py --source "$env:RUNNER_TEMP\libmpv" --source 'C:\ProgramData\chocolatey\lib\ffmpeg' --source 'C:\ProgramData\chocolatey\lib\ffmpeg-full' --destination packaging/media
      - run: python packaging/build_bundle.py --media-root packaging/media --dist-dir dist
      - name: Smoke test staged-media bundle
        run: python packaging/smoke_test.py dist/avialsync --demo --timeout 300
      - name: Prove the Linux bundle opens on a real display
        if: runner.os == 'Linux'
        # Every other check runs offscreen, which never loads the xcb plugin a
        # desktop uses: a bundle can pass them all and still fail to open a
        # window. These xcb runtime libraries are present on any real desktop,
        # so installing them keeps this a test of the bundle's plugin set.
        run: |
          sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon-x11-0
          xvfb-run -a python packaging/smoke_test.py dist/avialsync --qt-platform xcb --timeout 180

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress innosetup
          $env:AVIALSYNC_VERSION = "${{ github.ref_name }}".TrimStart("v")
          iscc packaging/windows/avialsync.iss
      - name: Sign the Windows installer
        # Secrets are unavailable to forks and are not configured yet, so this
        # is skipped rather than failed: an unsigned release still builds.
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh packaging/windows/sign.ps1 -Path installer-output/AvialSync-Setup.exe

      - name: Sign the macOS application bundle
        # Before the smoke test and the disk image: the .app must be signed
        # first so the image ships the signed copy, and notarization then has
        # something with a Developer ID signature to accept.
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash packaging/macos/sign_notarize.sh sign dist/AvialSync.app
      - name: Smoke test the macOS application bundle
        if: runner.os == 'macOS'
        # The .app is what the disk image ships, so it is what must start.
        run: python packaging/smoke_test.py dist --timeout 180
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p installer-output
          bash packaging/macos/make_dmg.sh dist/AvialSync.app installer-output/AvialSync.dmg
      - name: Notarize and staple the macOS disk image
        # Stapling is what lets a downloaded image open without a network
        # round trip, so it must follow the image rather than the .app.
        if: runner.os == 'macOS' && env.MACOS_NOTARY_APPLE_ID != ''
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: bash packaging/macos/sign_notarize.sh notarize installer-output/AvialSync.dmg
      - name: Build Linux AppImage from the verified repository tool source
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: d918b4df547b388ef253f3c9e7f6529ca81a885395c31f619d9aaf7030499a13
        run: |
          mkdir -p installer-output tooling
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$APPIMAGETOOL_URL" --output tooling/appimagetool
          echo "$APPIMAGETOOL_SHA256  tooling/appimagetool" | sha256sum --check --status
          chmod +x tooling/appimagetool
          APPIMAGETOOL="$PWD/tooling/appimagetool" bash packaging/linux/make_appimage.sh dist/avialsync installer-output/AvialSync.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer-output/*

  pypi_publish:
    name: Publish to PyPI
    needs: packages
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/avialsync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish wheel and source distribution through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release that failed after upload must not fail here;
          # verify_release_ref already proved the tag owns this exact version.
          skip-existing: true

  github_release:
    name: Create GitHub release
    needs: [verify_release_ref, packages, pypi_publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AvialSync-*-bundle
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets/python-distributions
      - name: Create GitHub release after installers and PyPI publish pass
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify_release_ref.outputs.prerelease == 'true' }}
          # An empty release is a silent failure; the installers are the release.
          fail_on_unmatched_files: true
          files: release-assets/**
