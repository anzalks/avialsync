name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    name: Release quality · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and type check
        if: matrix.python-version == '3.12'
        run: |
          ruff check .
          ruff format --check .
          mypy src/avialview/core
          mypy src/avialview
      - run: python tools/make_fixtures.py --small
      - run: pytest -x -q --ignore=tests/benchmarks
      - name: Run performance budgets
        if: matrix.python-version == '3.12'
        run: pytest tests/benchmarks --benchmark-only -q

  docs:
    name: Release documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  distributions:
    name: Build Python distributions
    needs: [quality, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  packages:
    name: Bundle ${{ matrix.os }}
    needs: [quality, docs, distributions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AvialView-windows-bundle
          - os: macos-latest
            artifact: AvialView-macos-bundle
          - os: ubuntu-latest
            artifact: AvialView-linux-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pyinstaller
      - name: Install media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libmpv2
      - name: Install media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
      - name: Install media dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress ffmpeg mpv
      - name: Stage media libraries (Linux)
        if: runner.os == 'Linux'
        run: python packaging/fetch_media_libs.py --source /usr/lib --source /usr/bin --destination packaging/media
      - name: Stage media libraries (macOS)
        if: runner.os == 'macOS'
        run: python packaging/fetch_media_libs.py --source "$(brew --prefix mpv)" --source "$(brew --prefix ffmpeg)" --destination packaging/media
      - name: Stage media libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/fetch_media_libs.py --source 'C:\ProgramData\chocolatey\lib' --destination packaging/media
      - run: python packaging/build_bundle.py --media-root packaging/media --dist-dir dist
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress innosetup
          $env:AVIALVIEW_VERSION = "${{ github.ref_name }}".TrimStart("v")
          iscc packaging/windows/avialview.iss
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p installer-output
          bash packaging/macos/make_dmg.sh dist/avialview installer-output/AvialView.dmg
      - name: Build Linux AppImage from the verified repository tool source
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_URL: ${{ vars.APPIMAGETOOL_URL }}
          APPIMAGETOOL_SHA256: ${{ vars.APPIMAGETOOL_SHA256 }}
        run: |
          test -n "$APPIMAGETOOL_URL"
          test -n "$APPIMAGETOOL_SHA256"
          mkdir -p installer-output tooling
          curl --fail --location --silent --show-error "$APPIMAGETOOL_URL" --output tooling/appimagetool
          echo "$APPIMAGETOOL_SHA256  tooling/appimagetool" | sha256sum --check --status
          chmod +x tooling/appimagetool
          APPIMAGETOOL="$PWD/tooling/appimagetool" bash packaging/linux/make_appimage.sh dist/avialview installer-output/AvialView.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer-output/*

  publish:
    name: Publish release
    needs: packages
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avialview
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AvialView-*-bundle
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release after all build gates pass
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
      - name: Publish wheel and source distribution through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
