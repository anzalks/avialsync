# Correctness on every push, on every branch: lint, types, and the full
# OS x Python test matrix. Nothing here freezes a bundle or builds an
# installer — that work belongs to a release tag and lives in release.yml,
# which additionally refuses any tag not reachable from main.
name: CI

on:
  push:
    # Every branch, not just main. Work sat on a feature branch for weeks with
    # no CI at all, so the first signal would have arrived at merge time.
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  QT_QPA_PLATFORM: offscreen

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .
      - name: Mypy Core
        run: mypy src/avialsync/core
      - name: Mypy All (standard mode; pre-existing errors suppressed in pyproject.toml)
        run: mypy src/avialsync

  test:
    name: Test ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint-type
    timeout-minutes: 15
    strategy:
      # One red job cancels the other five. The matrix exists to say *which*
      # platforms break, and cancelling costs some of that -- but a six-job
      # run is only as fast as the slowest queue, and waiting twenty minutes to
      # be told something you already knew after four is worse. Re-run the run
      # to get the rest of the picture once the first failure is understood.
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # PySide6, scipy, neo, h5py and polars are most of this job's setup.
          # Cached wheels take it from minutes to seconds on a warm key.
          cache: pip
          cache-dependency-path: pyproject.toml
          
      # --no-install-recommends is load-bearing, not tidiness: ffmpeg's
      # recommends pull yt-dlp, pipewire and a 27 MB pocketsphinx speech model,
      # none of which encode a fixture. A slow archive mirror spent twelve
      # minutes on them and took the whole 15-minute job down with it. The
      # codecs the fixtures need (libx264, libx265) are depends, not
      # recommends, and the Make Fixtures step below proves they arrived.
      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg libegl1
        
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
        
      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned deliberately. Chocolatey moved 8.1.2 -> 9.0.0 mid-day and
          # ffmpeg 9 removed `-vsync`, turning both Windows jobs red with no
          # commit in between; unpinned here also meant the installer bundled
          # whatever version release day happened to serve.
          # Only ffmpeg is installed: it encodes the fixtures. Decoding needs
          # nothing from the system since D-075, so the pinned libmpv archive
          # that used to be fetched and SHA-256 verified here is gone.
          choco install --no-progress ffmpeg --version=9.0.0

      - name: Install Project Dependencies
        run: pip install -e ".[dev]"

      - name: Verify the decoder is importable
        run: python -c "import av; print(f'PyAV {av.__version__} with bundled FFmpeg')"
        
      - name: Make Fixtures
        run: python tools/make_fixtures.py --small
        
      - name: Verify Determinism
        # Once per OS, not once per interpreter: the fixtures come out of
        # ffmpeg, and the Python version does not encode them. It re-runs the
        # whole generator, so the second copy is the expensive half of setup.
        if: matrix.python-version == '3.12'
        run: |
          cp -r tests/fixtures tests/fixtures_first_run
          python tools/make_fixtures.py --small
          python -c '
          import pathlib, filecmp, sys
          p1 = pathlib.Path("tests/fixtures")
          p2 = pathlib.Path("tests/fixtures_first_run")
          for f1 in p1.rglob("*.json"):
              f2 = p2 / f1.relative_to(p1)
              if not f2.exists() or not filecmp.cmp(f1, f2, shallow=False):
                  print(f"Mismatch in {f1}")
                  sys.exit(1)
          print("Determinism check passed!")
          '
        
      - name: Run Tests
        # A Qt/platform deadlock must fail at the specific test instead of
        # consuming the whole job timeout with no diagnostic evidence.
        # `--maxfail=1` for the same reason `fail-fast` is on: the first
        # failure is the one worth reading, and four more take minutes to
        # collect. `-q` keeps the progress line, which is what located a
        # segfault that printed no test name.
        run: pytest --maxfail=1 -q --durations=20 --timeout=60 --timeout-method=thread --ignore=tests/benchmarks

  docs:
    name: Read the Docs build
    runs-on: ubuntu-24.04
    needs: lint-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
