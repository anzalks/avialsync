# Correctness on every push, on every branch: lint, types, and the full
# OS x Python test matrix. Nothing here freezes a bundle or builds an
# installer — that work belongs to a release tag and lives in release.yml,
# which additionally refuses any tag not reachable from main.
name: CI

on:
  push:
    # Every branch, not just main. Work sat on a feature branch for weeks with
    # no CI at all, so the first signal would have arrived at merge time.
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  QT_QPA_PLATFORM: offscreen

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .
      - name: Mypy Core
        run: mypy src/avialsync/core
      - name: Mypy All (standard mode; pre-existing errors suppressed in pyproject.toml)
        run: mypy src/avialsync

  test:
    name: Test ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint-type
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          
      # --no-install-recommends is load-bearing, not tidiness: ffmpeg's
      # recommends pull yt-dlp, pipewire and a 27 MB pocketsphinx speech model,
      # none of which encode a fixture. A slow archive mirror spent twelve
      # minutes on them and took the whole 15-minute job down with it. The
      # codecs the fixtures need (libx264, libx265) are depends, not
      # recommends, and the Make Fixtures step below proves they arrived.
      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg libmpv2 libegl1
        
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv
        
      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress ffmpeg
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev-x86_64-20260607-git-71ebd08.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'libmpv'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --output $archive 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z/download'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'FAA0BE46643CD889A1D816696F60B9962D7BB70E9D9D6E619DA368D0B22211D6') {
            throw 'Downloaded libmpv archive did not match its pinned SHA-256'
          }
          & "$env:ChocolateyInstall\tools\7z.exe" x $archive "-o$destination" -y | Out-Null
          $libmpv = Get-ChildItem $destination -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $libmpv) {
            throw 'Pinned libmpv archive did not contain libmpv-2.dll'
          }
          $libmpv.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Project Dependencies
        run: pip install -e ".[dev]"

      - name: Verify libmpv is importable (Windows)
        if: runner.os == 'Windows'
        run: python -c "import mpv; print('libmpv import succeeded')"
        
      - name: Make Fixtures
        run: python tools/make_fixtures.py --small
        
      - name: Verify Determinism
        run: |
          cp -r tests/fixtures tests/fixtures_first_run
          python tools/make_fixtures.py --small
          python -c '
          import pathlib, filecmp, sys
          p1 = pathlib.Path("tests/fixtures")
          p2 = pathlib.Path("tests/fixtures_first_run")
          for f1 in p1.rglob("*.json"):
              f2 = p2 / f1.relative_to(p1)
              if not f2.exists() or not filecmp.cmp(f1, f2, shallow=False):
                  print(f"Mismatch in {f1}")
                  sys.exit(1)
          print("Determinism check passed!")
          '
        
      - name: Run Tests
        # A Qt/platform deadlock must fail at the specific test instead of
        # consuming the whole job timeout with no diagnostic evidence.
        run: pytest --maxfail=5 -q --durations=20 --timeout=60 --timeout-method=thread --ignore=tests/benchmarks

  docs:
    name: Read the Docs build
    runs-on: ubuntu-24.04
    needs: lint-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
