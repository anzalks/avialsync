name: Windows diagnostic

# Manual only. This exists to diagnose an intermittent native fault around
# libmpv client lifetime on Windows (see HANDOUT.md "Pending"), which nobody
# working on macOS or Linux can reproduce. It changes nothing and gates nothing.
#
# The ordinary test job runs `pytest -q`, which prints dots, so a process that
# dies mid-run leaves no record of which test was in flight. Everything here
# exists to answer that: name every test as it starts, flush immediately so the
# log survives a hard crash, and repeat the run so an intermittent fault has
# several chances to appear.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "How many times to run the suite"
        required: false
        default: "3"
      target:
        description: "pytest target (default: the whole suite)"
        required: false
        default: ""

permissions: {}

jobs:
  diagnose:
    name: Diagnose · windows-2022 · Python ${{ matrix.python-version }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: 1
      QT_QPA_PLATFORM: offscreen
      # Dump native faults with a Python traceback per thread, and never buffer:
      # a buffered line is a line lost when the process is killed outright.
      PYTHONFAULTHANDLER: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        shell: pwsh
        run: |
          choco install --no-progress ffmpeg
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev-x86_64-20260607-git-71ebd08.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'libmpv'
          curl.exe --fail --location --silent --show-error --retry 5 --retry-all-errors --output $archive 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z/download'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'FAA0BE46643CD889A1D816696F60B9962D7BB70E9D9D6E619DA368D0B22211D6') {
            throw 'Downloaded libmpv archive did not match its pinned SHA-256'
          }
          & "$env:ChocolateyInstall\tools\7z.exe" x $archive "-o$destination" -y | Out-Null
          $libmpv = Get-ChildItem $destination -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $libmpv) { throw 'Pinned libmpv archive did not contain libmpv-2.dll' }
          $libmpv.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Project Dependencies
        run: pip install -e ".[dev]"

      - name: Report the libmpv build under test
        continue-on-error: true
        run: |
          python -c "import mpv; m = mpv.MPV(vo='null'); print('libmpv', m.mpv_version); print('ffmpeg', m.ffmpeg_version)"

      # The whole hypothesis in one place, with no AvialSync code involved:
      # does creating a client and terminating it survive on Windows? Each
      # iteration is its own process so one fault cannot mask the next, and the
      # no-terminate arm is the control — if that survives and the terminate arm
      # does not, the fault belongs to teardown rather than to construction.
      - name: Isolate mpv construction and teardown
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic-logs | Out-Null
          $arms = @{
            "terminate"    = "import mpv; m = mpv.MPV(vo='null'); m.terminate()"
            "no-terminate" = "import mpv; m = mpv.MPV(vo='null')"
            "two-clients"  = "import mpv; a = mpv.MPV(vo='null'); b = mpv.MPV(vo='null'); a.terminate(); b.terminate()"
            "no-eventthread" = "import mpv; m = mpv.MPV(vo='null', start_event_thread=False); m.terminate()"
          }
          $report = @()
          foreach ($arm in $arms.GetEnumerator()) {
            $crashes = 0
            for ($i = 1; $i -le 20; $i++) {
              python -c $arm.Value 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { $crashes++ }
            }
            $line = "{0,-16} {1,2}/20 runs crashed" -f $arm.Key, $crashes
            Write-Host $line
            $report += $line
          }
          $report | Out-File diagnostic-logs/mpv-lifecycle.txt

      - name: Make Fixtures
        run: python tools/make_fixtures.py --small

      - name: Run the suite repeatedly, naming every test
        shell: pwsh
        continue-on-error: true
        run: |
          $repeats = [int]"${{ github.event.inputs.repeats }}"
          if ($repeats -lt 1) { $repeats = 3 }
          $target = "${{ github.event.inputs.target }}"
          New-Item -ItemType Directory -Force -Path diagnostic-logs | Out-Null
          $failures = 0
          for ($i = 1; $i -le $repeats; $i++) {
            Write-Host "=== attempt $i of $repeats ==="
            $log = "diagnostic-logs/attempt-$i-py${{ matrix.python-version }}.log"
            # -v names each test as it starts, so the last line before a native
            # fault identifies it. -p no:cacheprovider keeps runs independent.
            # Build the argument list so an empty target is omitted rather
            # than passed as an empty string, which pytest treats as a missing
            # path and exits before collecting anything.
            $pytestArgs = @('-X', 'faulthandler', '-m', 'pytest', '-v',
                            '-p', 'no:cacheprovider', '--timeout=120',
                            '--timeout-method=thread', '--ignore=tests/benchmarks')
            if ($target) { $pytestArgs += $target }
            & python @pytestArgs 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            Write-Host "attempt $i exit=$code"
            if ($code -ne 0) {
              $failures++
              Write-Host "--- last 40 lines of attempt $i ---"
              Get-Content $log -Tail 40
            }
          }
          Write-Host "=== $failures of $repeats attempts failed ==="
          "$failures of $repeats attempts failed" | Out-File diagnostic-logs/summary.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostic-py${{ matrix.python-version }}
          path: diagnostic-logs/
          retention-days: 7
